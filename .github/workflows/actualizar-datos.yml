name: Actualizar datos y publicar

on:
  schedule:
    - cron: '30 5 * * *'   # cada día sobre las 6:30-7:30 hora de Igualada
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: npm test
      - name: Descargar y normalizar datos
        env:
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
        run: npm run datos
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Datos del día"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
